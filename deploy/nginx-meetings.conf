# nginx vhost for Darth Meetings on .6 — installed as
# /etc/nginx/sites-available/meetings (symlinked into sites-enabled) by
# deploy/setup-blue-green.sh. The old sites-enabled/meeting-whisperer link
# must stay removed — its blocks live here.
#
# meetings.darth-internal.trames.io          → the live colour (blue/green, below)
# meeting-whisperer.darth-internal.trames.io → 301 to the new name
#
# Blue/green (README "Deploy"): two copies of the app —
#   blue  ~/apps/meeting-whisperer        pm2 meeting-whisperer        :3002
#   green ~/apps/meeting-whisperer-green  pm2 meeting-whisperer-green  :3012
# /etc/nginx/mw-active.conf (written by deploy.sh, NOT under conf.d/ — it is
# only meaningful inside the upstream block) names the live one, the other
# as `backup`:
#   server 127.0.0.1:3002;
#   server 127.0.0.1:3012 backup;
# deploy.sh builds + starts the idle colour, health-checks it on its own port,
# rewrites that file with the roles swapped and runs `nginx -t && nginx -s
# reload` (graceful: in-flight requests finish on the old workers).

upstream meetings_app {
    include /etc/nginx/mw-active.conf;
}

server {
    listen 80;
    server_name meetings.darth-internal.trames.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name meetings.darth-internal.trames.io;

    ssl_certificate     /etc/letsencrypt/live/darth-internal.trames.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darth-internal.trames.io/privkey.pem;

    # Meeting recordings can be multi-GB videos. Match the app limit (4GB)
    # and stream bodies straight through to Next (which streams to disk) —
    # buffering 4GB in nginx would double disk writes and add latency.
    client_max_body_size 4g;
    client_body_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;

    # Compress proxied responses (listing JSON shrinks ~7x). text/event-stream
    # is intentionally absent so the /api/events SSE stream is never buffered
    # by the compressor; binary media types are absent so range requests on
    # audio/video pass through untouched. Same block as the app./tasks. vhosts.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    # ---- maintenance notice + page (README "Deploy" → "Maintenance notice") ----
    # Static files in /var/www/mw-maintenance, so they answer while the app is
    # down. notice.json exists only while the owner has posted a notice
    # (deploy.sh --message / --notice); absent → 404 = no notice.
    location = /__notice.json {
        alias /var/www/mw-maintenance/notice.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        access_log off;
    }

    # nginx's OWN 502/503/504 (no colour answering) → a page that shows the
    # notice when there is one and retries every 5 s. The app's own 502/503
    # responses (e.g. "Darth Tasks unreachable") pass through untouched:
    # proxy_intercept_errors stays off.
    error_page 502 503 504 /__maintenance.html;
    location = /__maintenance.html {
        internal;
        alias /var/www/mw-maintenance/maintenance.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://meetings_app;
        # A refused/failed CONNECT on the live colour (it is restarting) is
        # retried on the backup colour. Only `error timeout`: http_502/503
        # would also replay the app's own 502 answers (several API routes
        # return 502 for an upstream failure) onto the other colour. Bounded so
        # a slow request (uploads, 900 s reads) is never replayed late.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 10s;
        proxy_connect_timeout 3s;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Old name — permanent redirect to the new one.
server {
    listen 80;
    server_name meeting-whisperer.darth-internal.trames.io;
    return 301 https://meetings.darth-internal.trames.io$request_uri;
}

server {
    listen 443 ssl;
    server_name meeting-whisperer.darth-internal.trames.io;

    ssl_certificate     /etc/letsencrypt/live/darth-internal.trames.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darth-internal.trames.io/privkey.pem;

    return 301 https://meetings.darth-internal.trames.io$request_uri;
}
