# nginx vhost for Darth Meetings on .6 — install as
# /etc/nginx/sites-available/meetings (symlink into sites-enabled, and REMOVE
# the old sites-enabled/meeting-whisperer link — its blocks live here now).
#
# meetings.darth-internal.trames.io          → app on 127.0.0.1:3002
# meeting-whisperer.darth-internal.trames.io → 301 to the new name

server {
    listen 80;
    server_name meetings.darth-internal.trames.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name meetings.darth-internal.trames.io;

    ssl_certificate     /etc/letsencrypt/live/darth-internal.trames.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darth-internal.trames.io/privkey.pem;

    # Meeting recordings can be multi-GB videos. Match the app limit (4GB)
    # and stream bodies straight through to Next (which streams to disk) —
    # buffering 4GB in nginx would double disk writes and add latency.
    client_max_body_size 4g;
    client_body_timeout 900s;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Old name — permanent redirect to the new one.
server {
    listen 80;
    server_name meeting-whisperer.darth-internal.trames.io;
    return 301 https://meetings.darth-internal.trames.io$request_uri;
}

server {
    listen 443 ssl;
    server_name meeting-whisperer.darth-internal.trames.io;

    ssl_certificate     /etc/letsencrypt/live/darth-internal.trames.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/darth-internal.trames.io/privkey.pem;

    return 301 https://meetings.darth-internal.trames.io$request_uri;
}
